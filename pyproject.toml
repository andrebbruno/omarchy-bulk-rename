[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-bulk-rename"
version = "0.1.0"
description = "Bulk rename for Omarchy: search and replace, patterns, numbering, case and dates across a pile of files — with a preview first and an undo after."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andre Bruno" }]
keywords = ["omarchy", "powertoys", "powerrename", "rename", "files", "hyprland", "nautilus"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
]
dependencies = []

[project.scripts]
omarchy-bulk-rename = "obulkrename.cli:main"

[project.urls]
Homepage = "https://github.com/andrebbruno/omarchy-bulk-rename"

[tool.setuptools.packages.find]
include = ["obulkrename*"]
